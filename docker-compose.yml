# One AIO container only — not a per-application Compose stack.
# Pull the published image, or pass --build to build locally from this repo.
# Local checkout testing (Linux binaries, isolated volumes): ./scripts/test-env.sh up
# Optional iGPU: docker compose -f docker-compose.yml -f compose.gpu.yml up -d
services:
  aio-media-manager:
    image: ghcr.io/qballjos/aio-media-server-manager:latest
    build:
      context: .
      args:
        AMM_GIT_SHA: ${AMM_GIT_SHA:-}
        AMM_VERSION: ${AMM_VERSION:-0.1.0}
    container_name: aio-media-manager
    restart: unless-stopped
    ports:
      - "8080:8080"     # manager
      - "8081:8081"     # qBittorrent
      - "8084:8084"     # Shelfmark
      - "8085:8085"     # SABnzbd
      - "8096:8096"     # Jellyfin
      - "8191:8191"     # Flaresolverr
      - "5055:5055"     # Seerr
      - "6060:6060"     # Grimmory
      - "6767:6767"     # Bazarr
      - "6789:6789"     # NZBGet
      - "6868:6868"     # Profilarr
      - "7878:7878"     # Radarr
      - "8686:8686"     # Lidarr
      - "8989:8989"     # Sonarr
      - "9696:9696"     # Prowlarr
      - "9705:9705"     # NeutArr
      - "32400:32400"   # Plex
    volumes:
      # One host tree for downloads + media so *Arr can hardlink (same FS / btrfs subvolume).
      # Default host path is the login home so the file manager can see the library.
      # Override with AMM_DATA_HOST=... (sudo compose uses /root unless you set this).
      - ./config:/config
      - ${AMM_DATA_HOST:-${HOME}/aio-media-manager}:/data
      # Config backups. Point this at another disk or NAS share so a failed /config disk keeps them.
      - ./backups:/backups
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
      AMM_DOWNLOAD_DIR: /data/downloads
      AMM_MEDIA_DIR: /data/media
      AMM_VPN_ENABLED: "false"
      AMM_VPN_ENFORCE: "false"
      AMM_CLOUDFLARE_TUNNEL_ENABLED: "false"
      AMM_TRUSTED_PROXIES: ""
      # Optional GitHub token for install/update rate limits (or set it in Settings → Updates):
      # GITHUB_TOKEN: ""
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    # Required for WireGuard/OpenVPN + netns isolation of qBittorrent.
    privileged: true
    # Intel/AMD transcoding: add compose.gpu.yml (do not map /dev/dri unless it exists).
