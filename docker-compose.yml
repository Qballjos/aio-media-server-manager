# One AIO container only — not a per-application compose stack.
# Pull the published image, or pass --build to build locally from this repo.
services:
  aio-media-manager:
    image: ghcr.io/qballjos/aio-media-server-manager:latest
    build: .
    container_name: aio-media-manager
    restart: unless-stopped
    ports:
      - "8080:8080"
      # Uncomment to publish managed app WebUIs on the host, or use network_mode: host.
      # - "8081:8081"   # qBittorrent
      # - "8085:8085"   # SABnzbd
      # - "8096:8096"   # Jellyfin
      # - "8989:8989"   # Sonarr
      # - "7878:7878"   # Radarr
      # - "9696:9696"   # Prowlarr
      # - "5055:5055"   # Seerr
      # - "32400:32400" # Plex
    volumes:
      - ./config:/config
      - ./downloads:/downloads
      - ./media:/media
    environment:
      PUID: "1000"
      PGID: "1000"
      AMM_VPN_ENABLED: "false"
      AMM_VPN_ENFORCE: "false"
      AMM_TRUSTED_PROXIES: ""
    devices:
      - /dev/dri:/dev/dri
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    # Required for WireGuard/OpenVPN + netns isolation of qBittorrent.
    privileged: true
