version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # vue-router 5 is a major migration; keep on 4.x until explicitly upgraded.
    ignore:
      - dependency-name: "vue-router"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Seerr requires Node 22 (`engines.node: ^22.19.0`). The appliance copies
    # Node from node:*-bookworm-slim for Seerr; frontend build uses node:22-alpine.
    # Do not open major bumps past 22 until Seerr’s engines change.
    ignore:
      - dependency-name: "node"
        versions: [">=23"]
