name: Bug report
description: Something is broken or unexpected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for the report. Do not include passwords, API keys, or VPN configuration.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment mode
      options:
        - Native Linux / LXC
        - Single Docker container
        - Unraid
        - Synology
        - TrueNAS
        - Development (Docker test env)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Git commit or version
      placeholder: e.g. main @ abc123
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets first. Prefer a Settings → Diagnostics share URL when you can.
      render: text
  - type: input
    id: debug-share
    attributes:
      label: Diagnostics share URL (optional)
      description: Time-limited `/debug/{token}` from Settings → Diagnostics. Do not paste passwords or VPN configs.
