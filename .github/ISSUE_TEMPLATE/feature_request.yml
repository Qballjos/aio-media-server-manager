name: Feature request
description: Propose a new capability that fits the architecture
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? Prefer managed processes inside the AIO appliance, not extra Docker containers.
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This does not add Debrid functionality
          required: true
        - label: This does not require one Docker container per application
          required: true
