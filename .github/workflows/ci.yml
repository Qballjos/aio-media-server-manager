name: CI

# Tests for application code. Docs/wiki → docs.yml. Images → docker.yml.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "main.py"
      - "pyproject.toml"
      - "poetry.lock"
      - "api/**"
      - "applications/**"
      - "core/**"
      - "frontend/**"
      - "tests/**"
      - "scripts/e2e_server.py"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "main.py"
      - "pyproject.toml"
      - "poetry.lock"
      - "api/**"
      - "applications/**"
      - "core/**"
      - "frontend/**"
      - "tests/**"
      - "scripts/e2e_server.py"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Poetry
        run: pipx install poetry
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi
      - name: Ruff
        run: poetry run ruff check core api applications tests
      - name: Pytest
        run: poetry run pytest -q
        env:
          AMM_CONFIG_DIR: ${{ runner.temp }}/amm-config
          AMM_DOWNLOAD_DIR: ${{ runner.temp }}/amm-downloads
          AMM_MEDIA_DIR: ${{ runner.temp }}/amm-media

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  browser:
    name: Browser journeys (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install Python dependencies
        run: |
          pipx install poetry
          poetry install --no-interaction --no-ansi
          echo "E2E_PYTHON=$(poetry env info --executable)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx --no-install playwright install --with-deps chromium
      - name: Desktop and mobile journeys
        working-directory: frontend
        run: npm run test:e2e
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ matrix.arch }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
