name: CI

# Image builds live in docker.yml (skipped on docs-only edits).
# Pages builds live in docs.yml (runs on docs-only edits).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/prepare-docs-site.sh"
      - ".github/workflows/docs.yml"
      - "logo-aio-media-manager.png"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/prepare-docs-site.sh"
      - ".github/workflows/docs.yml"
      - "logo-aio-media-manager.png"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Install Poetry
        run: pipx install poetry
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi
      - name: Ruff
        run: poetry run ruff check core api applications tests
      - name: Pytest
        run: poetry run pytest -q
        env:
          AMM_CONFIG_DIR: ${{ runner.temp }}/amm-config
          AMM_DOWNLOAD_DIR: ${{ runner.temp }}/amm-downloads
          AMM_MEDIA_DIR: ${{ runner.temp }}/amm-media

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
