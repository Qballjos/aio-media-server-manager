# Synology Container Manager project — one AIO container only.
# Place this file at /volume1/docker/aio-media-manager/docker-compose.yml
# Do not add extra services for Sonarr, Radarr, or download clients.

services:
  aio-media-manager:
    image: ghcr.io/qballjos/aio-media-server-manager:latest
    container_name: aio-media-manager
    restart: unless-stopped
    ports:
      - "8080:8080"     # manager
      - "8081:8081"     # qBittorrent
      - "8084:8084"     # Shelfmark
      - "8085:8085"     # SABnzbd
      - "8096:8096"     # Jellyfin
      - "8191:8191"     # Flaresolverr
      - "5055:5055"     # Seerr
      - "6060:6060"     # Grimmory
      - "6767:6767"     # Bazarr
      - "6789:6789"     # NZBGet
      - "6868:6868"     # Profilarr
      - "7878:7878"     # Radarr
      - "8686:8686"     # Lidarr
      - "8989:8989"     # Sonarr
      - "9696:9696"     # Prowlarr
      - "9705:9705"     # NeutArr
      - "19001:19001"   # Recyclarr
      - "32400:32400"   # Plex
    volumes:
      - /volume1/docker/aio-media-manager/config:/config
      # Same shared folder (not two separate DSM shares) so *Arr can hardlink.
      - /volume1/data:/data
    environment:
      PUID: "1026"
      PGID: "100"
      TZ: UTC
      AMM_DOWNLOAD_DIR: /data/downloads
      AMM_MEDIA_DIR: /data/media
      AMM_VPN_ENABLED: "false"
      AMM_VPN_ENFORCE: "false"
      AMM_CLOUDFLARE_TUNNEL_ENABLED: "false"
      AMM_CLOUDFLARE_TUNNEL_TOKEN_FILE: /config/cloudflare/tunnel.token
      AMM_TRUSTED_PROXIES: ""
      # Optional GitHub token for install/update rate limits (or Settings → GitHub):
      # GITHUB_TOKEN: ""
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    privileged: true
    # Uncomment if the NAS has an iGPU and /dev/dri exists:
    # devices:
    #   - /dev/dri:/dev/dri
