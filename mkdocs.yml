site_name: AIO Media Server Manager
site_description: One install for your whole home media stack — downloads, automation, and streaming.
site_url: https://qballjos.github.io/aio-media-server-manager/
repo_url: https://github.com/Qballjos/aio-media-server-manager
repo_name: Qballjos/aio-media-server-manager
edit_uri: ""
docs_dir: .docs-site
site_dir: site

theme:
  name: material
  language: en
  logo: assets/logo-aio-media-manager.png
  favicon: assets/logo-aio-media-manager.png
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_javascript:
  - javascripts/showcase.js

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: nl
          name: Nederlands
          build: true
          site_description: Eén installatie voor je hele media-stack thuis — downloads, automatisering en afspelen.
          nav_translations:
            Beginner guides: Aan de slag
            Start here: Begin hier
            Using AIO: AIO gebruiken
            Choose your server: Kies jouw server
            Docker on Linux: Docker op Linux
            Advanced: Geavanceerd
            Dashboard reference: Dashboard — naslag
            Ports and settings: Poorten en instellingen
            Home: Start
            Getting started: Aan de slag
            Install: Installeren
            Using the dashboard: Het dashboard gebruiken
            Deploy: Platforms
            Overview: Overzicht
            Remote access: Toegang van buitenaf
        - locale: de
          name: Deutsch
          build: true
          site_description: Eine Installation für den ganzen Medien-Stapel zu Hause — Downloads, Automatisierung und Wiedergabe.
          nav_translations:
            Beginner guides: Einstieg
            Start here: Hier beginnen
            Using AIO: AIO benutzen
            Choose your server: Server auswählen
            Docker on Linux: Docker auf Linux
            Advanced: Fortgeschritten
            Dashboard reference: Dashboard-Referenz
            Ports and settings: Ports und Einstellungen
            Home: Start
            Getting started: Erste Schritte
            Install: Installieren
            Using the dashboard: Das Dashboard nutzen
            Deploy: Bereitstellen
            Overview: Überblick
            Remote access: Fernzugriff
        - locale: fr
          name: Français
          build: true
          site_description: Une installation pour toute la pile média à la maison — téléchargements, automatisation et lecture.
          nav_translations:
            Beginner guides: Pour débuter
            Start here: Commencer ici
            Using AIO: Utiliser AIO
            Choose your server: Choisir votre serveur
            Docker on Linux: Docker sur Linux
            Advanced: Avancé
            Dashboard reference: Référence du tableau de bord
            Ports and settings: Ports et paramètres
            Home: Accueil
            Getting started: Pour commencer
            Install: Installer
            Using the dashboard: Utiliser le tableau de bord
            Deploy: Déployer
            Overview: Aperçu
            Remote access: Accès distant

hooks:
  - docs/hooks/donate.py
  - docs/hooks/showcase.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Qballjos/aio-media-server-manager
  generator: false

nav:
  - Home: index.md
  - Beginner guides:
      - Start here: INSTALL.md
      - Using AIO: USAGE.md
      - Choose your server: deploy/README.md
      - Unraid: deploy/UNRAID.md
      - Synology: deploy/SYNOLOGY.md
      - Docker on Linux: deploy/DOCKER.md
      - TrueNAS: deploy/TRUENAS.md
  - Advanced:
      - Overview: ADVANCED.md
      - Dashboard reference: USAGE_ADVANCED.md
      - Ports and settings: REFERENCE.md
      - Unraid: deploy/UNRAID_ADVANCED.md
      - Synology: deploy/SYNOLOGY_ADVANCED.md
      - Docker: deploy/DOCKER_ADVANCED.md
      - TrueNAS: deploy/TRUENAS_ADVANCED.md
      - Linux / LXC: deploy/LINUX.md
      - Remote access:
          - Cloudflare Tunnel: deploy/CLOUDFLARE.md
          - Cloudflare Access: deploy/CLOUDFLARE_ACCESS.md
